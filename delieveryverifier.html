<!DOCTYPE html>
<html lang="en">
<head>
<script>
    (function() {
        const AUTH_KEY = 'tipper_admin_auth';
        const AUTH_TOKEN = 'pawanboss_auth_verified';
        if (sessionStorage.getItem(AUTH_KEY) !== AUTH_TOKEN && localStorage.getItem(AUTH_KEY) !== AUTH_TOKEN) {
            window.location.replace('/admin');
        }
    })();
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftRoute | Secure Order Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .status-badge {
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
        }

        .order-ready-card {
            background: #f0f9ff;
            border-left: 4px solid #0284c7;
            color: #0c4a6e;
        }

        @keyframes fadeInUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .animate-fade-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }

        .shimmer {
            background: linear-gradient(90deg, #4f46e5 0%, #6366f1 50%, #4f46e5 100%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite linear;
        }

        @keyframes shimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }
    </style>
</head>
<body class="bg-slate-100 flex justify-center items-center min-h-screen p-4">

<!-- Admin Suite Navigation Button -->
<div class="no-print fixed top-3 left-3 z-50">
    <a href="/admin" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-900/90 hover:bg-slate-900 text-white text-xs font-bold border border-white/20 shadow-lg backdrop-blur-md transition-all hover:scale-105" style="text-decoration:none;">
        <svg class="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        <span>Admin Suite</span>
    </a>
</div>


    <!-- Container -->
    <div id="main-container" class="glass-panel p-8 md:p-10 rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.1)] max-w-lg w-full transition-all duration-500 overflow-hidden relative">
        
        <!-- Animated Background Blob -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-100 rounded-full blur-3xl opacity-50"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-blue-100 rounded-full blur-3xl opacity-50"></div>

        <!-- Header Section -->
        <div class="text-center mb-8 relative z-10">
            <div class="inline-flex items-center justify-center p-4 bg-indigo-600 rounded-2xl mb-5 shadow-xl shadow-indigo-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.952 11.952 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            </div>
            <h1 class="text-3xl font-black text-slate-900 tracking-tight leading-none">SwiftRoute <span class="text-indigo-600">SecurePay</span></h1>
            <div id="status-container" class="mt-2">
                <span id="app-subtitle" class="text-[10px] bg-slate-100 text-slate-500 px-3 py-1 rounded-full font-black uppercase tracking-[0.2em]">Verified Secure Portal</span>
            </div>
        </div>

        <!-- VIEW 1: Form Input -->
        <div id="form-view" class="space-y-6 relative z-10">
            <form id="orderForm" class="space-y-5">
                <div class="space-y-3">
                    <label class="block text-[11px] font-black uppercase tracking-widest text-slate-400">Shipping Logistics</label>
                    <div class="group relative">
                        <input type="text" id="streetAddress" placeholder="Full Street Address" required 
                            class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white outline-none transition-all">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="city" placeholder="City" required 
                            class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white outline-none transition-all">
                        <input type="text" id="pincode" placeholder="Pincode" required maxlength="6" 
                            class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white outline-none transition-all font-mono tracking-widest">
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="block text-[11px] font-black uppercase tracking-widest text-slate-400">Payment Gateway Allocation</label>
                    <div class="space-y-2">
                        <div class="flex items-center p-4 border-2 border-indigo-600 bg-indigo-50/50 rounded-2xl shadow-sm">
                            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center mr-4 shadow-lg shadow-indigo-200">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z" />
                                    <path fill-rule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM5 12a1 1 0 112 0 1 1 0 01-2 0zm7-1a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd" />
                                </svg>
                            </div>
                            <div>
                                <p class="text-sm font-extrabold text-indigo-900 leading-none">Instant UPI / Cards</p>
                                <p class="text-[10px] text-indigo-500 font-bold mt-1 uppercase tracking-tighter">Verified Merchant Transfer</p>
                            </div>
                            <div class="ml-auto">
                                <div class="h-5 w-5 rounded-full border-4 border-indigo-600 bg-white ring-4 ring-indigo-50"></div>
                            </div>
                        </div>

                        <div class="flex items-center p-4 border border-slate-200 bg-slate-50 rounded-2xl opacity-40 grayscale pointer-events-none">
                            <div class="w-10 h-10 bg-slate-300 rounded-xl flex items-center justify-center mr-4">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 002-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 4a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
                                </svg>
                            </div>
                            <span class="text-sm font-bold text-slate-500">Cash on Delivery</span>
                            <span class="ml-auto text-[9px] font-black bg-slate-200 px-2 py-1 rounded-md text-slate-500 uppercase">Blocked</span>
                        </div>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full py-5 bg-indigo-600 text-white font-black rounded-2xl hover:bg-indigo-700 transition-all active:scale-[0.98] shadow-xl shadow-indigo-100 uppercase tracking-[0.15em] text-sm">
                    Generate Order Token
                </button>
            </form>
            <p class="text-[10px] text-slate-400 text-center px-4 leading-relaxed">By proceeding, you acknowledge this order is strictly <strong>PREPAID ONLY</strong>. COD requests will be auto-canceled.</p>
        </div>

        <!-- VIEW 2: Order Confirmation -->
        <div id="result-view" class="hidden space-y-6 relative z-10">
            <div id="result-content" class="space-y-5 animate-fade-up">
                <!-- Dynamic Content -->
            </div>
            
            <div class="flex flex-col gap-3 pt-4">
                <button id="payBtn" class="w-full py-5 shimmer text-white font-black rounded-2xl transition-all active:scale-95 shadow-xl shadow-indigo-100 uppercase tracking-widest text-sm">
                    Pay Now via Secure Link
                </button>
                <button id="copyBtn" class="w-full py-4 bg-slate-100 text-slate-600 font-bold rounded-2xl hover:bg-slate-200 transition-all text-xs uppercase tracking-widest">
                    Copy Order Hash
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Component -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-4 rounded-3xl shadow-2xl opacity-0 pointer-events-none transition-all duration-500 flex items-center translate-y-10 z-50">
        <div class="h-2 w-2 bg-indigo-400 rounded-full mr-4 animate-ping"></div>
        <span id="toastMsg" class="text-xs font-bold uppercase tracking-widest">Message</span>
    </div>

    <script>
        const formView = document.getElementById('form-view');
        const resultView = document.getElementById('result-view');
        const resultContent = document.getElementById('result-content');
        const orderForm = document.getElementById('orderForm');
        const pincodeInput = document.getElementById('pincode');
        const appSubtitle = document.getElementById('app-subtitle');
        const toast = document.getElementById('toast');
        const submitBtn = document.getElementById('submitBtn');

        let currentOrderHash = "";

        // Pincode validation
        pincodeInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });

        orderForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const street = document.getElementById('streetAddress').value.trim();
            const city = document.getElementById('city').value.trim();
            const pin = pincodeInput.value.trim();

            if (pin.length !== 6) {
                showToast("Invalid Pincode Format");
                return;
            }

            // Loading State
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            `;

            setTimeout(() => {
                const orderId = "SRX-" + Math.random().toString(36).substr(2, 9).toUpperCase();
                currentOrderHash = `TOKEN: ${orderId} | LOC: ${city}-${pin} | STATUS: PREPAID-AUTH`;
                
                showSuccessView(orderId, street, city, pin);
                
                formView.classList.add('hidden');
                resultView.classList.remove('hidden');
                appSubtitle.innerText = "Security Validation Passed";
                appSubtitle.className = "text-[10px] bg-green-100 text-green-600 px-3 py-1 rounded-full font-black uppercase tracking-[0.2em]";
            }, 1200);
        });

        function showSuccessView(orderId, street, city, pin) {
            resultContent.innerHTML = `
                <div class="text-center">
                    <p class="text-[10px] font-black text-indigo-500 uppercase tracking-widest mb-1">Generated Tracking ID</p>
                    <h2 class="text-3xl font-black text-slate-900">${orderId}</h2>
                </div>

                <div class="order-ready-card p-6 rounded-3xl space-y-3 shadow-inner">
                    <div class="flex items-center text-sm font-black uppercase">
                        <svg class="w-5 h-5 mr-2 text-blue-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                        Prepaid Route Locked
                    </div>
                    <p class="text-[11px] leading-relaxed font-medium">Your shipment address in <b>${city}</b> has been validated for priority dispatch. COD is restricted to prevent fraudulent claims.</p>
                    <div class="pt-2 border-t border-blue-200">
                        <div class="flex justify-between items-center text-[10px] font-black uppercase">
                            <span>Reservation Expires:</span>
                            <span class="text-blue-700 bg-blue-100 px-2 py-0.5 rounded" id="timer">14:59</span>
                        </div>
                    </div>
                </div>

                <div class="bg-slate-50 border border-slate-100 rounded-3xl p-6 space-y-4 shadow-sm">
                    <div class="flex justify-between">
                        <span class="text-[10px] font-black text-slate-400 uppercase">Destination</span>
                        <span class="text-xs font-extrabold text-slate-800 text-right max-w-[150px] leading-tight">${street}, ${city} (${pin})</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-[10px] font-black text-slate-400 uppercase">Surcharge Status</span>
                        <span class="text-[10px] font-black text-green-600 uppercase">Waiver Applied</span>
                    </div>
                </div>
            `;
            startTimer();
        }

        function startTimer() {
            let time = 899; // 15 mins
            const timerDisplay = document.getElementById('timer');
            const interval = setInterval(() => {
                const mins = Math.floor(time / 60);
                const secs = time % 60;
                if (timerDisplay) {
                    timerDisplay.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }
                time--;
                if (time < 0) clearInterval(interval);
            }, 1000);
        }

        document.getElementById('copyBtn').onclick = function() {
            const el = document.createElement('textarea');
            el.value = currentOrderHash;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast("Order Hash Copied");
        };

        document.getElementById('payBtn').onclick = function() {
            showToast("Redirecting to Bank...");
            this.innerHTML = "Opening Gateway...";
            setTimeout(() => {
                location.reload();
            }, 2000);
        };

        function showToast(text) {
            document.getElementById('toastMsg').innerText = text;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-10');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-10');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 2500);
        }
    </script>
</body>
</html>
